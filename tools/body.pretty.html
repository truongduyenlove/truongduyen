hí\",\"colFeature\":\"Tính năng\",\"colFree\":\"Miễn phí\",\"colPaid\":\"Trả phí\",\"featureAllTemplates\":\"Tất cả mẫu thiệp\",\"featureUnlimitedEdit\":\"Chỉnh sửa không giới hạn\",\"featureMediaContent\":\"Nhạc nền, ảnh, video\",\"featureGoogleMaps\":\"Bản đồ Google Maps\",\"featureQrCode\":\"QR Code nhận mừng cưới\",\"featureUsageDuration\":\"Thời gian sử dụng\",\"featureGuestCount\":\"Số khách mời\",\"featureDownloadImage\":\"Tải thiệp dạng video và ảnh\",\"featureChangeTemplate\":\"Đổi mẫu bất cứ lúc nào\",\"usageFree\":\"3 ngày\",\"usagePaid\":\"Vĩnh viễn\",\"guestFree\":\"{count} người\",\"guestPaid\":\"Không giới hạn\",\"faqTitle\":\"Câu hỏi thường gặp\",\"ctaFallbackTitle\":\"Bắt đầu tạo thiệp cưới ngay\",\"ctaFallbackDesc\":\"Miễn phí tạo và chỉnh sửa. Chỉ thanh toán khi bạn thực sự hài lòng.\",\"ctaChooseTemplate\":\"Chọn mẫu thiệp yêu thích\",\"ctaViewGuide\":\"Xem hướng dẫn tạo thiệp\",\"benefitUnlimitedGuests\":\"Khách xem không giới hạn\",\"benefitForever\":\"Thiệp hoạt động vĩnh viễn\",\"benefitGuestNames\":\"Ghi tên khách mời không giới hạn\",\"benefitGoogleMaps\":\"Bản đồ chỉ đường Google Maps\",\"benefitUnlimitedPhotos\":\"Album ảnh không giới hạn\",\"benefitQrCode\":\"QR Code nhận mừng cưới\",\"benefitGuestStats\":\"Thống kê khách mời chi tiết\",\"benefitChangeTemplate\":\"Đổi mẫu bất cứ lúc nào, nội dung giữ nguyên\",\"heroTitle\":\"Bảng giá đơn giản, không phí ẩn\",\"heroDesc\":\"Thiệp cưới online đẹp, đầy đủ tính năng cho ngày trọng đại của bạn.\",\"eyebrow\":\"Bảng giá\",\"heroImageAlt\":\"Thiệp cưới online Chung Đôi xem trên điện thoại\",\"templateFreedomPill\":\"Đổi mẫu bất cứ lúc nào\",\"trustPill1\":\"Dùng thử miễn phí 3 ngày\",\"trustPill2\":\"Sở hữu vĩnh viễn\",\"cardPayment\":\"Thẻ, Apple/Google Pay\",\"internationalCardOnly\":\"Thanh toán cần thẻ có logo quốc tế Visa, Mastercard, American Express hoặc JCB. Thẻ nội địa {scheme} không thanh toán được.\",\"oneTimeBadge\":\"Thanh toán một lần cho mỗi thiệp\",\"securePayment\":\"Thanh toán hanh toán một lần và sở hữu thiệp trọn đời.\\n\\nThiệp sẽ trở thành kỷ niệm kỹ thuật số đẹp mà bạn có thể xem lại bất cứ lúc nào.\",\"faq3Q\":\"{price} bao gồm những gì?\",\"faq3A\":\"Với {price}, bạn sẽ nhận được trọn bộ tính năng:\\n\\n- Mời không giới hạn người\\n- Thiệp hoạt động vĩnh viễn\\n- Ghi tên người nhận trên thiệp\\n- Tải thiệp dạng video và ảnh\\n- Bản đồ chỉ đường Google Maps\\n- Album ảnh không giới hạn\\n- QR Code nhận mừng cưới\\n- Thống kê khách mời chi tiết\",\"faq4Q\":\"Có phải trả thêm phí hàng tháng không?\",\"faq4A\":\"**Không!** Bạn chỉ cần thanh toán một lần duy nhất. Không có phí ẩn, không có phí duy trì, không có phí gia hạn. Thiệp của bạn sẽ hoạt động vĩnh viễn mà không phải trả thêm bất kỳ chi phí nào.\",\"faq5Q\":\"Tại sao cần tạo nhiều thiệp cưới?\",\"faq5A\":\"Nhiều cặp đôi cần thiệp riêng cho từng nhóm khách mời khác nhau:\\n\\n- **Nhà trai \u0026 nhà gái:** Mỗi bên có thông tin tiệc, địa điểm và thời gian khác nhau.\\n- **Bạn bè \u0026 đồng nghiệp:** Thiệp phong cách trẻ trung, khác với thiệp gửi cho họ hàng.\\n- **Khách xa \u0026 khách gần:** Thiệp cho khách ở xa có thể thêm thông tin đặt phòng, di chuyển.\\n\\nThiệp thứ 2 trở đi chỉ **{returningPrice}** (giảm 50%), giúp bạn tiết kiệm khi cần nhiều thiệp.\",\"faq6Q\":\"Thanh toán rồi còn chỉnh sửa được không?\",\"faq6A\":\"**Được!** Sau khi thanh toán, bạn vẫn chỉnh sửa thoải mái:\\n\\n- Sửa thông tin cặp đôi, gia đình, ngày giờ, địa điểm\\n- Thay ảnh, thêm nhạc, cập nhật bản đồ\\n- Đổi sang mẫu thiệp khác (nội dung được giữ nguyên)\\n\\nMọi thay đổi cập nhật ngay trên link đã gửi, không cần gửi lại link mới cho khách mời.\",\"faq7Q\":\"Làm sao tạo thiệp thứ 2 nhanh nhất?\",\"faq7A\":\"Dùng tính năng **Nhân bản** trong trang quản lý. Nhân bản sẽ tạo thiệp mới với toàn bộ nội dung từ thiệp cũ (tên, ảnh, nhạc, bản đồ...), bạn chỉ cần sửa những thông tin khác biệt.\\n\\nRất tiện khi cần thiệp riêng cho nhà trai, nhà gái, chỉ cần đổi địa điểm và thời gian tiệc.\",\"faq8Q\":\"Thanh toán bằng cách nào?\",\"faq8A\":\"ChungDoi hỗ trợ thanh toán qua **chuyển khoản ngân hàng**. Khi bạn nhấn thanh toán, hệ thống sẽ tạo mã QR chuyển khoản. Bạn quét mã bằng app ngân hàng và thiệp được kích hoạt tự động trong vài giây.\\n\\nBạn có thể quét mã QR hoặc chuyển khoản thủ công bằng số tài khoản hiển thị trên màn hình. Hỗ trợ tất cả ngân hàng tại Việt Nam.\",\"faq8ACard\":\"ChungDoi hỗ trợ thanh toán quốc tế an toàn qua **Visa, Mastercard, Apple Pay và Google Pay**, qua đối tác cổng thẻ bảo mật của ChungDoi. Khi bạn nhấn thanh toán, hệ thống sẽ mở trang checkout bảo mật.\\n\\nSau khi thanh toán thành công, thiệp được kích hoạt tự động. Mọi giao dịch đều được mã hóa và bảo mật.\\n\\nGiá hiển thị chưa gồm thuế địa phương; tổng tiền khi thanh toán đã bao gồm khoản thuế áp dụng ở nước bạn. Nếu thẻ bị trừ bằng loại tiền khác, ngân hàng của bạn quyết định tỷ giá cuối cùng và một số thẻ có thêm phí giao dịch quốc tế.\",\"faq9Q\":\"Chính sách hoàn tiền như thế nào?\",\"faq9A\":\"Chung Đôi cho bạn **dùng thử miễn phí 3 ngày** với đầy đủ tính năng: bạn xem thiệp thật, gửi thử cho người thân, chỉnh tới khi ưng ý rồi mới thanh toán. Vì vậy bạn chỉ trả tiền khi đã thực sự hài lòng, và sau khi thiệp được kích hoạt thì Chung Đôi không hoàn tiền cho trường hợp đổi ý.\\n\\nChung Đôi vẫn hoàn tiền cho các trường hợp rõ ràng: **thanh toán trùng lặp**, **lỗi nghiêm trọng không khắc phục được trong 7 ngày**, hoặc **giao dịch trái phép** mà bạn không hề thực hiện. Với trường hợp đặc biệt khác, Chung Đôi xem xét theo từng tình huống cụ thể.\\n\\nBạn nhắn tin cho Chung Đôi (nhanh nhất) hoặc gửi email tới **hello@chungdoi.com** kèm mã giao dịch, Chung Đôi sẽ phản hồi trong 3 ngày làm việc. Bạn nhớ báo trong vòng 30 ngày kể từ ngày thanh toán nhé. Xem đầy đủ tại trang chính sách hoàn tiền.\",\"schemaName\":\"Thiệp cưới online - Chung Đôi\",\"approxLocalNoteWithTax\":\"đã gồm thuế\",\"approxLocalHint\":\"Giá hiển thị chưa gồm thuế địa phương; tổng tiền khi thanh toán đã bao gồm khoản thu h đại lý\",\"heroTitle1\":\"Thiệp cưới mang thương hiệu của bạn\",\"heroTitle2\":\"với giá sỉ ưu đãi\",\"heroDesc\":\"Dành cho tiệm in thiệp cưới, studio và wedding planner. Mỗi thiệp online mang tên thương hiệu của bạn, mua theo gói với giá sỉ.\",\"videoTitle\":\"Hướng dẫn đại lý Chung Đôi\",\"benefitsTitle\":\"Lợi ích khi trở thành đại lý\",\"benefitsSubtitle\":\"Quảng bá thương hiệu, giá tốt hơn, hợp tác lâu dài\",\"benefit1Title\":\"Thương hiệu của bạn trên mỗi thiệp\",\"benefit1Desc\":\"Chữ \\\"powered by\\\" ở chân thiệp đổi thành tên và link của bạn, và khách nhắn tin hỗ trợ qua Messenger của bạn. Mỗi thiệp mời khoảng 200 khách, tức khoảng 200 người thấy thương hiệu của bạn, miễn phí.\",\"benefit2Title\":\"Giá sỉ ưu đãi\",\"benefit2Desc\":\"Mua gói thiệp với giá đại lý, tiết kiệm đáng kể so với mua lẻ.\",\"benefit3Title\":\"Thiệp hoạt động vĩnh viễn\",\"benefit3Desc\":\"Thiệp kích hoạt bằng gói của bạn sẽ hoạt động vĩnh viễn, không giới hạn lượt xem hay khách mời.\",\"benefit4Title\":\"Gói thiệp không hết hạn\",\"benefit4Desc\":\"Mua bao nhiêu dùng bấy nhiêu, không áp lực thời gian. Gói thiệp nằm trong tài khoản mãi mãi.\",\"benefit5Title\":\"Được giới thiệu tới các cặp đôi\",\"benefit5Desc\":\"Tiệm của bạn xuất hiện trên trang tìm tiệm in thiệp cưới của Chung Đôi, tiếp cận các cặp đôi đang tìm chỗ in thiệp gần bạn, kèm link về website của bạn.\",\"processTitle\":\"Quy trình hợp tác\",\"step\":\"Bước {n}\",\"step1Title\":\"Mua gói đại lý\",\"step1Desc\":\"Chọn gói phù hợp và thanh toán ngay trên trang này. Tài khoản đại lý kích hoạt tự động khi thanh toán thành công.\",\"step2Title\":\"Thiết lập thương hiệu\",\"step2Desc\":\"Gắn tên, website và Messenger của bạn vào chân mỗi thiệp bạn tạo.\",\"step3Title\":\"Bàn giao tài khoản cho khách\",\"step3Desc\":\"Tạo tài khoản để khách tự làm thiệp. Khi khách cần hỗ trợ, bạn có thể vào tài khoản của khách để làm hộ.\",\"packagesTitle\":\"Các gói thiệp\",\"packagesSubtitle\":\"Mua gói đầu tiên là tài khoản đại lý được kích hoạt. Gói không hết hạn, mỗi thiệp đều mang thương hiệu của bạn.\",\"packageUnit\":\"thiệp\",\"packagePopular\":\"Phổ biến\",\"packagesBrandNote\":\"Gắn thương hiệu của bạn lên mọi thiệp và để khách liên hệ hỗ trợ qua kênh của bạn. Bán hoặc tặng theo giá của bạn.\",\"featuresTitle\":\"Tính năng dành cho đại lý\",\"feature1Title\":\"Trang quản lý riêng\",\"feature1Desc\":\"Bảng điều khiển hiển thị số thiệp còn lại, danh sách khách hàng, và thiệp đã tạo.\",\"feature2Title\":\"Tạo tài khoản cho khách\",\"feature2Desc\":\"Tạo tài khoản nhanh cho khách bằng email. Khách nhận link đăng nhập tự động.\",\"feature3Title\":\"Quản lý tài khoản khách\",\"feature3Desc\":\"Truy cập tài khoản khách để hỗ trợ chỉnh sửa thiệp. Khách vẫn tự quản lý được.\",\"feature4Title\":\"Trung tâm tài nguyên bán hàng\",\"feature4Desc\":\"Trong trang quản lý đại lý có video thiệp demo, bài viết mẫu, banner, mockup và kịch bản tư vấn để bạn giới thiệu Chung Đôi nhanh hơn.\",\"feature5Title\":\"Hỗ trợ ưu tiên\",\"feature5Desc\":\"Đại lý được hỗ trợ ưu tiên qua Messenger khi cần trợ giúp.\",\"faqTitle\":\"Câu hỏi thường gặp\",\"faq1Q\":\"Thiệp đã thanh toán có thời hạn không?\",\"faq1A\":\"Thiệp đã kích hoạt sẽ hoạt động **vĩnh viễn**, không giới hạn lượt xem, không giới hạn khách mời.\",\"faq2Q\":\"Tôi có thể tạo thiệp thay cho khách không?\",\"faq2A\":\"Có. Quy trình chính là **tạo tài khoản cho khách** rồi gửi link đăng nhập để khách tự tạo và chỉnh sửa thiệp. Khi khách cần hỗ trợ, bạn có thể **trực tiếp vào tài khoản khách** để tạo hoặc chỉnh sửa thiệp giúp khách.\",\"faq3Q\":\"Khách hàng có tự quản lý thiệp được không?\",\"faq3A\":\"Được. Sau khi bạn tạo tài khoản, khách có thể tự đăng nhập để xem và chỉnh sửa thiệp của mình bất cứ lúc nào.\",\"faq4Q\":\"Gói thiệp có hạn sử dụng không?\",\"faq4A\":\"Không. Gói thiệp mua rồi sẽ nằm trong tài khoản đại lý, dùng khi nào cũng được, không hết hạn.\",\"faq5Q\":\"Làm sao để bắt đầu?\",\"faq5A\":\"Chọn một gói ở phần **Các gói thiệp** phía trên rồ
